name: Deploy website to GitHub Pages

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The manuscript lives in a private repo, so the default GITHUB_TOKEN cannot reach it.
      # A read-only deploy key on total529resources, held here as MANUSCRIPT_DEPLOY_KEY, is
      # what the content build reads its source from.
      - name: Check out the manuscript submodule
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/manuscript -o IdentitiesOnly=yes
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/stdin ~/.ssh/manuscript <<< "${{ secrets.MANUSCRIPT_DEPLOY_KEY }}"
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          git submodule update --init --depth 1 resources/manuscript

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      # --watch defaults to false outside a TTY, so this is a single run.
      - run: npm test

      - run: npm run build:pages

      # enablement turns Pages on via the API if it has never been configured,
      # so a fresh clone of this repo needs no manual Settings visit.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/website/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
